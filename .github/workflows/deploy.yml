name: Deploy TREK to Google Cloud Run

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PROJECT_ID: smiling-accord-491807-q2
  REGION: asia-east2
  SERVICE_NAME: trek
  IMAGE: mauriceboe/nomad

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get image tag
        id: get_tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG:-latest}"
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ steps.get_tag.outputs.tag }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --port 3000 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production" \
            --timeout 300 \
            --add-volume name=trek-data,type=cloud-storage,bucket=trek-data-pmulhall \
            --add-volume-mount volume=trek-data,mount-path=/app/data \
            --add-volume name=trek-uploads,type=cloud-storage,bucket=trek-data-pmulhall \
            --add-volume-mount volume=trek-uploads,mount-path=/app/uploads

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "✅ TREK deployed at: $URL"

name: Deploy TREK to Google Cloud Run

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggers

env:
  PROJECT_ID: smiling-accord-491807-q2
  REGION: asia-east2          # Hong Kong — change to your preferred region
  SERVICE_NAME: trek
  IMAGE: mauriceboe/nomad     # The upstream public Docker Hub image

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get latest image tag from release
        id: get_tag
        run: |
          # Use the GitHub release tag (e.g. v2.6.2) — strip leading 'v'
          TAG="${{ github.event.release.tag_name }}"
          # Fallback to 'latest' for manual runs
          TAG="${TAG:-latest}"
          # Strip leading 'v' if present (e.g. v2.6.2 → 2.6.2)
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Deploying image: ${{ env.IMAGE }}:${TAG}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ steps.get_tag.outputs.tag }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --port 3000 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production,PORT=3000" \
            --timeout 300

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "✅ TREK deployed at: $URL"
